name: Adaptive full-project audit

on:
  pull_request:
    paths:
      - 'audit/**'
      - '.github/workflows/adaptive-project-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adaptive-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CI: 'true'
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - name: Checkout audit harness
        uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - name: Checkout exact GitMir baseline
        uses: actions/checkout@v4
        with:
          ref: 0c9db4635407cb30faab7a3f1887634db097324e
          path: target
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout exact Adaptive quality-engine source
        uses: actions/checkout@v4
        with:
          repository: Dimkox/adaptive-grok-build-pro
          ref: be752872f3e5a9d6fe179872d9c8bdaec4338238
          path: adaptive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit-only Python dependencies
        run: python -m pip install PyYAML==6.0.2
      - name: Install isolated browser test tooling
        if: runner.os == 'Linux'
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Run all checks without changing product source
        run: python harness/audit/adaptive_run.py --target target --factory adaptive --output audit-results
      - name: Preserve exact-SHA evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adaptive-audit-${{ runner.os }}
          path: audit-results
          if-no-files-found: error
          retention-days: 14
